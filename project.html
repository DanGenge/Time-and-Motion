<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Project — Time & Motion Tracker</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#0093D1">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
</head>
<body>
<div id="topbar-container"></div>
<div class="wrap">
  <div class="card">
    <div class="row between">
      <h2 id="projName" class="mb0">Loading project…</h2>
      <span class="badge online" id="memberCount"></span>
    </div>
    <p class="muted" id="projDesc"></p>
  </div>

  <div class="grid cols-2">
    <div class="card">
      <div class="row between">
        <h3>Observation runs</h3>
        <button class="small" onclick="openNewRun()">+ New run</button>
      </div>
      <div id="newRunForm" class="hidden mt8">
        <div class="field"><label>Run name</label><input id="rnName" placeholder="e.g. Day shift 03 Aug"></div>
        <div class="grid cols-2">
          <div class="field"><label>Blast / shot name</label><input id="rnBlast" placeholder="e.g. RN14_UPG_BL18"></div>
          <div class="field"><label>Default MMU / asset</label><input id="rnAsset" placeholder="e.g. BM318"></div>
          <div class="field"><label>Location</label><input id="rnLocation" placeholder="e.g. Ravensworth Pit"></div>
          <div class="field"><label># MMUs observed</label><input type="number" id="rnMmuCount" placeholder="e.g. 5"></div>
          <div class="field"><label># Observation days</label><input type="number" id="rnDays" placeholder="e.g. 5"></div>
          <div class="field"><label>DTH tonnes (optional)</label><input type="number" id="rnDth" placeholder="e.g. 105"></div>
        </div>
        <div class="row">
          <button onclick="createRun()">Start run</button>
          <button class="secondary" onclick="closeNewRun()">Cancel</button>
        </div>
        <p class="muted" style="font-size:12px;margin-top:4px;"># MMUs × # days drives the hrs/MMU/day figures in Reports.</p>
      </div>
      <div id="runList" class="mt16"></div>
    </div>

    <div class="card">
      <h3>Project members</h3>
      <div id="memberList"></div>
      <div class="row mt16">
        <input id="inviteEmail" placeholder="teammate@orica.com" style="flex:2;">
        <button class="small" onclick="addMember()">Add</button>
      </div>
      <p class="muted" style="font-size:12px;margin-top:6px;">They must already have an account. Ask them to sign up first.</p>
    </div>
  </div>

  <div class="card">
    <h3>Quick links</h3>
    <div class="row">
      <a class="btn" id="lnkTemplates" href="templates.html">📋 Manage activities</a>
      <a class="btn secondary" id="lnkDimensions" href="dimensions.html">📐 Dimensions</a>
      <a class="btn secondary" id="lnkReports" href="reports.html">📊 Reports</a>
      <a class="btn secondary" id="lnkExport" href="export.html">⬇️ Export</a>
    </div>
  </div>
</div>
<script>
let PROJECT_ID = getParam("project");
let CURRENT_USER = null;

async function boot(){
  if(!PROJECT_ID){ window.location.href="index.html"; return; }
  CURRENT_USER = await requireAuth(); if(!CURRENT_USER) return;
  await renderTopbar("project", CURRENT_USER);
  ["lnkTemplates","lnkDimensions","lnkReports","lnkExport"].forEach(id => {
    const a = document.getElementById(id);
    a.href = a.getAttribute("href").split("?")[0] + `?project=${PROJECT_ID}`;
  });
  await loadProject(); await loadMembers(); await loadRuns();
}

async function loadProject(){
  const {data,error}=await sb.from("projects").select("*").eq("id",PROJECT_ID).single();
  if(error){ toast("Could not load project — no access.","error"); return; }
  document.getElementById("projName").textContent=data.name;
  document.getElementById("projDesc").textContent=data.description||"";
}

async function loadMembers(){
  const {data,error}=await sb.from("project_members").select("role,user_id,profiles(display_name,email)").eq("project_id",PROJECT_ID);
  if(error)return;
  document.getElementById("memberCount").textContent=`${data.length} member${data.length===1?"":"s"}`;
  document.getElementById("memberList").innerHTML=data.map(m=>`
    <div class="row between" style="padding:6px 0;border-bottom:1px solid var(--border);">
      <span>${escapeHtml(m.profiles?.display_name||"Unknown")} <span class="muted">(${m.role})</span></span>
    </div>`).join("");
}

async function addMember(){
  const email=document.getElementById("inviteEmail").value.trim(); if(!email)return;
  const {data:profile,error:pErr}=await sb.from("profiles").select("id").eq("email",email).maybeSingle();
  if(pErr||!profile)return toast("No account with that email — ask them to sign up first.","error");
  const {error}=await sb.from("project_members").insert({project_id:PROJECT_ID,user_id:profile.id,role:"member"});
  if(error)return toast(error.message.includes("duplicate")?"Already a member.":error.message,"error");
  toast("Member added!"); document.getElementById("inviteEmail").value=""; loadMembers();
}

function openNewRun(){document.getElementById("newRunForm").classList.remove("hidden");}
function closeNewRun(){document.getElementById("newRunForm").classList.add("hidden");}

async function createRun(){
  const run_name=document.getElementById("rnName").value.trim();
  if(!run_name)return toast("Give the run a name","error");
  const payload={
    project_id:PROJECT_ID,run_name,
    blast_name:document.getElementById("rnBlast").value.trim()||null,
    asset_name:document.getElementById("rnAsset").value.trim()||null,
    location:document.getElementById("rnLocation").value.trim()||null,
    mmu_count:parseFloat(document.getElementById("rnMmuCount").value)||null,
    observation_days:parseFloat(document.getElementById("rnDays").value)||null,
    dth_tonnes:parseFloat(document.getElementById("rnDth").value)||null,
    started_by:CURRENT_USER.id,started_by_name:CURRENT_USER.display_name
  };
  const {data,error}=await sb.from("study_runs").insert(payload).select().single();
  if(error)return toast(error.message,"error");
  window.location.href=`tracker.html?project=${PROJECT_ID}&run=${data.id}`;
}

async function deleteRun(runId, runName){
  const { count } = await sb.from("entries").select("id",{count:"exact",head:true}).eq("run_id",runId);
  const n = count || 0;
  const msg = n>0
    ? `Delete "${runName}"?\n\nThis permanently removes the run AND its ${n} recorded ${n===1?'entry':'entries'}. This cannot be undone.`
    : `Delete "${runName}"?\n\nThis run has no entries yet. This cannot be undone.`;
  if(!confirm(msg)) return;
  const { error: eErr } = await sb.from("entries").delete().eq("run_id",runId);
  if(eErr) return toast(eErr.message,"error");
  const { error } = await sb.from("study_runs").delete().eq("id",runId);
  if(error) return toast(error.message,"error");
  toast(`"${runName}" deleted`);
  loadRuns();
}

async function loadRuns(){
  const {data,error}=await sb.from("study_runs").select("*").eq("project_id",PROJECT_ID).order("started_at",{ascending:false});
  if(error)return;
  const list=document.getElementById("runList");
  if(!data.length){list.innerHTML=`<p class="muted">No runs yet — start one above.</p>`;return;}
  list.innerHTML=data.map(r=>`
    <div class="row between" style="padding:10px 0;border-bottom:1px solid var(--border);">
      <div>
        <div style="font-weight:600;">${escapeHtml(r.run_name)} ${r.status==='active'?'<span class="badge online">active</span>':''}</div>
        <div class="muted" style="font-size:12px;">${escapeHtml(r.blast_name||'')} ${r.asset_name?'· '+escapeHtml(r.asset_name):''} ${r.mmu_count?'· '+r.mmu_count+' MMUs':''} ${r.observation_days?'× '+r.observation_days+'d':''} ${r.dth_tonnes?'· '+r.dth_tonnes+'t DTH':''} · ${fmtDateTime(r.started_at)}</div>
      </div>
      <div class="row" style="gap:6px;">
        <button class="small" onclick="window.location.href='tracker.html?project=${PROJECT_ID}&run=${r.id}'">${r.status==='active'?'Continue':'View'} →</button>
        <button class="small danger" title="Delete this run" onclick='deleteRun("${r.id}", ${JSON.stringify(r.run_name)})'>🗑 Delete</button>
      </div>
    </div>`).join("");
}
boot();
</script>
</body>
</html>
