<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Reports — Time &amp; Motion Tracker</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
</head>
<body>

<div id="topbar-container"></div>

<div class="wrap">

  <!-- Filters -->
  <div class="card">
    <h3>Filters</h3>
    <div class="grid cols-3">
      <div class="field"><label>Runs</label><select id="fRuns" multiple size="4"></select></div>
      <div class="field"><label>Users</label><select id="fUsers" multiple size="4"></select></div>
      <div class="field"><label>Steps</label><select id="fSteps" multiple size="4"></select></div>
      <div class="field"><label>Type</label>
        <select id="fType"><option value="">All</option><option value="task">Task</option><option value="delay">Delay</option><option value="break">Break</option></select>
      </div>
      <div class="field"><label>From date</label><input type="date" id="fFrom"></div>
      <div class="field"><label>To date</label><input type="date" id="fTo"></div>
    </div>
    <button onclick="applyFilters()">Apply filters</button>
    <span class="muted" id="filterSummary" style="margin-left:10px;font-size:12px;"></span>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('summary')" id="tab-summary">Summary &amp; Efficiency</div>
    <div class="tab" onclick="switchTab('compare')" id="tab-compare">Compare / Chart builder</div>
    <div class="tab" onclick="switchTab('trend')" id="tab-trend">Trend over time</div>
  </div>

  <!-- Tab: Summary -->
  <div id="panel-summary">
    <div class="card">
      <h3>Per-step summary (filtered data)</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Step</th><th>Type</th><th>Count</th><th>Avg</th><th>Min</th><th>Max</th><th>Total</th><th>Target</th><th>Efficiency</th><th>Skip %</th></tr></thead>
          <tbody id="summaryBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Tab: Compare / Chart builder -->
  <div id="panel-compare" class="hidden">
    <div class="card">
      <h3>Build your comparison</h3>
      <div class="grid cols-3">
        <div class="field"><label>Rows (group by)</label>
          <select id="cRows">
            <option value="step_name">Step</option>
            <option value="recorded_by_name">User</option>
            <option value="run_name">Run</option>
            <option value="cycle_number">Cycle</option>
            <option value="step_type">Type</option>
            <option value="date">Date</option>
          </select>
        </div>
        <div class="field"><label>Columns (split by, optional)</label>
          <select id="cCols">
            <option value="">None</option>
            <option value="recorded_by_name">User</option>
            <option value="run_name">Run</option>
            <option value="step_type">Type</option>
          </select>
        </div>
        <div class="field"><label>Metric</label>
          <select id="cMetric">
            <option value="avg">Average duration</option>
            <option value="total">Total duration</option>
            <option value="count">Count</option>
            <option value="efficiency">Efficiency % (target/avg)</option>
          </select>
        </div>
        <div class="field"><label>Chart style</label>
          <select id="cChart">
            <option value="table">Table only</option>
            <option value="bar">Bar</option>
            <option value="stackedbar">Stacked bar</option>
            <option value="line">Line</option>
            <option value="pie">Pie</option>
            <option value="doughnut">Doughnut</option>
            <option value="scatter">Scatter</option>
          </select>
        </div>
      </div>
      <button onclick="buildCompare()">Build</button>
    </div>
    <div class="card">
      <div class="table-wrap"><table id="pivotTable"><thead></thead><tbody></tbody></table></div>
      <div style="max-width:100%;margin-top:16px;"><canvas id="compareCanvas" height="100"></canvas></div>
    </div>
  </div>

  <!-- Tab: Trend -->
  <div id="panel-trend" class="hidden">
    <div class="card">
      <div class="row">
        <div class="field" style="min-width:220px;"><label>Step to trend</label><select id="tStep"></select></div>
        <div class="field" style="min-width:220px;"><label>X-axis</label>
          <select id="tXAxis"><option value="cycle_number">Cycle number</option><option value="created_at">Timestamp</option></select>
        </div>
      </div>
      <button onclick="buildTrend()">Build trend</button>
    </div>
    <div class="card"><canvas id="trendCanvas" height="90"></canvas></div>
  </div>

</div>

<script>
let PROJECT_ID = getParam("project");
let ALL_ENTRIES = [];
let FILTERED = [];
let TEMPLATES = [];
let compareChart = null, trendChart = null;

async function boot() {
  if (!PROJECT_ID) { window.location.href = "index.html"; return; }
  const user = await requireAuth();
  if (!user) return;
  await renderTopbar("reports", user);
  await loadFilterOptions();
  await loadData();
  applyFilters();
}

async function loadFilterOptions() {
  const [{ data: runs }, { data: templates }] = await Promise.all([
    sb.from("study_runs").select("id, run_name").eq("project_id", PROJECT_ID).order("started_at", { ascending: false }),
    sb.from("step_templates").select("*").eq("project_id", PROJECT_ID).order("sort_order")
  ]);
  TEMPLATES = templates || [];
  document.getElementById("fRuns").innerHTML = (runs||[]).map(r => `<option value="${r.id}">${escapeHtml(r.run_name)}</option>`).join("");
  document.getElementById("fSteps").innerHTML = TEMPLATES.map(s => `<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`).join("");
  document.getElementById("tStep").innerHTML = TEMPLATES.map(s => `<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`).join("");
}

async function loadData() {
  const { data, error } = await sb.from("entries")
    .select("*, study_runs(run_name)")
    .eq("project_id", PROJECT_ID)
    .order("created_at", { ascending: true });
  if (error) return toast(error.message, "error");
  ALL_ENTRIES = (data||[]).map(e => ({ ...e, run_name: e.study_runs?.run_name || "" }));
  const users = [...new Set(ALL_ENTRIES.map(e => e.recorded_by_name).filter(Boolean))];
  document.getElementById("fUsers").innerHTML = users.map(u => `<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`).join("");
}

function selectedValues(id) {
  return Array.from(document.getElementById(id).selectedOptions).map(o => o.value);
}

function applyFilters() {
  const runs = selectedValues("fRuns");
  const users = selectedValues("fUsers");
  const steps = selectedValues("fSteps");
  const type = document.getElementById("fType").value;
  const from = document.getElementById("fFrom").value;
  const to = document.getElementById("fTo").value;

  FILTERED = ALL_ENTRIES.filter(e => {
    if (runs.length && !runs.includes(e.run_id)) return false;
    if (users.length && !users.includes(e.recorded_by_name)) return false;
    if (steps.length && !steps.includes(e.step_name)) return false;
    if (type && e.step_type !== type) return false;
    if (from && new Date(e.created_at) < new Date(from)) return false;
    if (to && new Date(e.created_at) > new Date(to + "T23:59:59")) return false;
    return true;
  });
  document.getElementById("filterSummary").textContent = `${FILTERED.length} entries match`;
  renderSummary();
}

function switchTab(name) {
  ["summary","compare","trend"].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle("active", t===name);
    document.getElementById(`panel-${t}`).classList.toggle("hidden", t!==name);
  });
}

// ---------- Summary tab ----------
function renderSummary() {
  const byStep = {};
  FILTERED.forEach(e => {
    const key = e.step_name + "|" + e.step_type;
    byStep[key] = byStep[key] || { name: e.step_name, type: e.step_type, durations: [], skips: 0, count: 0 };
    if (e.skipped) byStep[key].skips++;
    else byStep[key].durations.push(e.duration_seconds || 0);
    byStep[key].count++;
  });
  const rows = Object.values(byStep).map(s => {
    const tmpl = TEMPLATES.find(t => t.name === s.name);
    const avg = s.durations.length ? s.durations.reduce((a,b)=>a+b,0)/s.durations.length : null;
    const min = s.durations.length ? Math.min(...s.durations) : null;
    const max = s.durations.length ? Math.max(...s.durations) : null;
    const totalDuration = s.durations.reduce((a,b)=>a+b,0);
    const target = tmpl?.target_seconds;
    const eff = (target && avg) ? (target/avg*100) : null;
    const skipPct = s.count ? (s.skips/s.count*100) : 0;
    return { ...s, avg, min, max, totalDuration, target, eff, skipPct };
  }).sort((a,b) => a.name.localeCompare(b.name));

  document.getElementById("summaryBody").innerHTML = rows.map(r => `
    <tr>
      <td>${escapeHtml(r.name)}</td>
      <td><span class="badge ${r.type}">${r.type}</span></td>
      <td>${r.count}</td>
      <td>${fmtDuration(r.avg)}</td>
      <td>${fmtDuration(r.min)}</td>
      <td>${fmtDuration(r.max)}</td>
      <td>${fmtDuration(r.totalDuration)}</td>
      <td>${r.target ? fmtDuration(r.target) : "—"}</td>
      <td>${r.eff ? `<span style="color:${r.eff>=100?'#00843D':r.eff>=85?'#d97706':'#dc2626'};font-weight:700;">${r.eff.toFixed(0)}%</span>` : "—"}</td>
      <td>${r.skipPct.toFixed(0)}%</td>
    </tr>`).join("") || `<tr><td colspan="10" class="muted">No data matches your filters.</td></tr>`;
}

// ---------- Compare / Chart builder tab ----------
function metricLabel(row, metric) {
  if (row.durations.length === 0) return metric === "count" ? row.count : null;
  const avg = row.durations.reduce((a,b)=>a+b,0)/row.durations.length;
  const total = row.durations.reduce((a,b)=>a+b,0);
  if (metric === "avg") return avg;
  if (metric === "total") return total;
  if (metric === "count") return row.count;
  if (metric === "efficiency") {
    if (!row.target) return null;
    return row.target/avg*100;
  }
  return null;
}

function rowKeyFor(e, field) {
  if (field === "date") return fmtDate(e.created_at);
  return e[field] ?? "(none)";
}

function buildCompare() {
  const rowsField = document.getElementById("cRows").value;
  const colsField = document.getElementById("cCols").value;
  const metric = document.getElementById("cMetric").value;
  const chartType = document.getElementById("cChart").value;

  const rowKeys = [...new Set(FILTERED.map(e => rowKeyFor(e, rowsField)))].sort();
  const colKeys = colsField ? [...new Set(FILTERED.map(e => rowKeyFor(e, colsField)))].sort() : ["value"];

  const cells = {}; // rowKey|colKey -> {durations, count, target}
  FILTERED.forEach(e => {
    const rk = rowKeyFor(e, rowsField);
    const ck = colsField ? rowKeyFor(e, colsField) : "value";
    const key = rk + "||" + ck;
    if (!cells[key]) {
      const tmpl = TEMPLATES.find(t => t.name === (rowsField === "step_name" ? rk : e.step_name));
      cells[key] = { durations: [], count: 0, target: tmpl?.target_seconds };
    }
    cells[key].count++;
    if (!e.skipped) cells[key].durations.push(e.duration_seconds || 0);
  });

  // Render pivot table
  const thead = document.getElementById("pivotTable").querySelector("thead");
  const tbody = document.getElementById("pivotTable").querySelector("tbody");
  thead.innerHTML = `<tr><th>${rowsField}</th>${colKeys.map(c=>`<th>${escapeHtml(String(c))}</th>`).join("")}</tr>`;
  const dataMatrix = rowKeys.map(rk => colKeys.map(ck => metricLabel(cells[rk+"||"+ck] || {durations:[],count:0}, metric)));
  tbody.innerHTML = rowKeys.map((rk, i) => `
    <tr><td>${escapeHtml(String(rk))}</td>${dataMatrix[i].map(v => `<td>${v==null?'—':(metric==='efficiency'?v.toFixed(0)+'%':metric==='count'?v:fmtDuration(v))}</td>`).join("")}</tr>
  `).join("");

  // Render chart
  const ctx = document.getElementById("compareCanvas").getContext("2d");
  if (compareChart) compareChart.destroy();
  if (chartType === "table") return;

  const palette = ["#00843D","#0a66c2","#d97706","#7c3aed","#dc2626","#0891b2","#65a30d","#c026d3"];
  let type = chartType === "stackedbar" ? "bar" : chartType;
  let datasets;
  if (chartType === "scatter") {
    datasets = colKeys.map((ck,i) => ({
      label: ck,
      data: rowKeys.map((rk, ri) => ({ x: ri, y: dataMatrix[ri][i] })).filter(d=>d.y!=null),
      backgroundColor: palette[i % palette.length]
    }));
  } else {
    datasets = colKeys.map((ck, i) => ({
      label: ck,
      data: dataMatrix.map(row => row[i]),
      backgroundColor: palette[i % palette.length],
      borderColor: palette[i % palette.length],
      fill: chartType === "line" ? false : true
    }));
  }
  const options = { responsive: true, plugins: { legend: { display: colKeys.length>1 || ["pie","doughnut"].includes(chartType) } } };
  if (chartType === "stackedbar") {
    options.scales = { x: { stacked: true }, y: { stacked: true } };
  }
  compareChart = new Chart(ctx, {
    type: type === "pie" || type === "doughnut" ? type : type,
    data: { labels: rowKeys.map(String), datasets },
    options
  });
}

// ---------- Trend tab ----------
function buildTrend() {
  const step = document.getElementById("tStep").value;
  const xAxis = document.getElementById("tXAxis").value;
  const rows = FILTERED.filter(e => e.step_name === step && !e.skipped)
    .sort((a,b) => xAxis === "cycle_number" ? a.cycle_number - b.cycle_number : new Date(a.created_at)-new Date(b.created_at));
  const labels = rows.map(r => xAxis === "cycle_number" ? "Cycle " + r.cycle_number : fmtDateTime(r.created_at));
  const data = rows.map(r => r.duration_seconds);
  const tmpl = TEMPLATES.find(t => t.name === step);

  const ctx = document.getElementById("trendCanvas").getContext("2d");
  if (trendChart) trendChart.destroy();
  const datasets = [{ label: step + " — actual (s)", data, borderColor: "#00843D", backgroundColor: "#00843D33", fill: false, tension: .25 }];
  if (tmpl?.target_seconds) {
    datasets.push({ label: "Target (s)", data: rows.map(()=>tmpl.target_seconds), borderColor: "#dc2626", borderDash: [6,4], pointRadius: 0 });
  }
  trendChart = new Chart(ctx, { type: "line", data: { labels, datasets }, options: { responsive: true } });
}

boot();
</script>
</body>
</html>
