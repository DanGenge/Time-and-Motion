<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Templates — Time &amp; Motion Tracker</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
</head>
<body>

<div id="topbar-container"></div>

<div class="wrap">
  <div class="card">
    <div class="row between">
      <h2 class="mb0">Step templates</h2>
      <button class="small" onclick="openNewStep()">+ New step</button>
    </div>
    <p class="muted" style="font-size:13px;">Define every task, delay and break your team will record against. Use the arrows to set the order they'll appear on the tracker.</p>
  </div>

  <div id="newStepCard" class="card hidden">
    <h3>New / edit step</h3>
    <input type="hidden" id="editId">
    <div class="grid cols-2">
      <div class="field"><label>Step name</label><input id="stName" placeholder="e.g. Position truck under shovel"></div>
      <div class="field">
        <label>Type</label>
        <select id="stType">
          <option value="task">Task</option>
          <option value="delay">Delay</option>
          <option value="break">Break</option>
        </select>
      </div>
      <div class="field"><label>Category (optional)</label><input id="stCategory" placeholder="e.g. Loading cycle"></div>
      <div class="field"><label>Target/standard time (seconds, optional)</label><input type="number" id="stTarget" placeholder="e.g. 90"></div>
    </div>
    <div class="row">
      <button onclick="saveStep()">Save</button>
      <button class="secondary" onclick="closeNewStep()">Cancel</button>
    </div>
  </div>

  <div class="card">
    <div id="stepList"></div>
  </div>
</div>

<script>
let PROJECT_ID = getParam("project");
let STEPS = [];

async function boot() {
  if (!PROJECT_ID) { window.location.href = "index.html"; return; }
  const user = await requireAuth();
  if (!user) return;
  await renderTopbar("templates", user);
  await loadSteps();
}

function openNewStep(step) {
  document.getElementById("newStepCard").classList.remove("hidden");
  document.getElementById("editId").value = step?.id || "";
  document.getElementById("stName").value = step?.name || "";
  document.getElementById("stType").value = step?.step_type || "task";
  document.getElementById("stCategory").value = step?.category || "";
  document.getElementById("stTarget").value = step?.target_seconds || "";
}
function closeNewStep(){ document.getElementById("newStepCard").classList.add("hidden"); }

async function saveStep() {
  const id = document.getElementById("editId").value;
  const name = document.getElementById("stName").value.trim();
  const step_type = document.getElementById("stType").value;
  const category = document.getElementById("stCategory").value.trim();
  const target = document.getElementById("stTarget").value;
  if (!name) return toast("Enter a step name", "error");
  const payload = {
    name, step_type, category: category || null,
    target_seconds: target ? parseFloat(target) : null
  };
  let error;
  if (id) {
    ({ error } = await sb.from("step_templates").update(payload).eq("id", id));
  } else {
    payload.project_id = PROJECT_ID;
    payload.sort_order = STEPS.length;
    ({ error } = await sb.from("step_templates").insert(payload));
  }
  if (error) return toast(error.message, "error");
  toast("Saved!");
  closeNewStep();
  loadSteps();
}

async function toggleActive(id, val) {
  await sb.from("step_templates").update({ is_active: val }).eq("id", id);
  loadSteps();
}

async function deleteStep(id) {
  if (!confirm("Delete this step template? Existing recorded entries will keep their data.")) return;
  await sb.from("step_templates").delete().eq("id", id);
  loadSteps();
}

async function move(id, dir) {
  const idx = STEPS.findIndex(s => s.id === id);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= STEPS.length) return;
  const a = STEPS[idx], b = STEPS[swapIdx];
  await sb.from("step_templates").update({ sort_order: b.sort_order }).eq("id", a.id);
  await sb.from("step_templates").update({ sort_order: a.sort_order }).eq("id", b.id);
  loadSteps();
}

async function loadSteps() {
  const { data, error } = await sb.from("step_templates").select("*").eq("project_id", PROJECT_ID).order("sort_order");
  if (error) { toast(error.message, "error"); return; }
  STEPS = data;
  const list = document.getElementById("stepList");
  if (!data.length) { list.innerHTML = `<p class="muted">No steps yet — click "+ New step" to add your first task, delay or break.</p>`; return; }
  list.innerHTML = data.map((s, i) => `
    <div class="row between" style="padding:10px 0;border-bottom:1px solid var(--border);${s.is_active?'':'opacity:.5;'}">
      <div>
        <span class="badge ${s.step_type}">${s.step_type}</span>
        <strong>${escapeHtml(s.name)}</strong>
        ${s.category ? `<span class="muted"> · ${escapeHtml(s.category)}</span>` : ""}
        ${s.target_seconds ? `<span class="muted"> · target ${fmtDuration(s.target_seconds)}</span>` : ""}
      </div>
      <div class="row">
        <button class="ghost small" onclick="move('${s.id}', -1)" ${i===0?'disabled':''}>↑</button>
        <button class="ghost small" onclick="move('${s.id}', 1)" ${i===data.length-1?'disabled':''}>↓</button>
        <button class="secondary small" onclick='openNewStep(${JSON.stringify(s).replace(/'/g,"&#39;")})'>Edit</button>
        <button class="secondary small" onclick="toggleActive('${s.id}', ${!s.is_active})">${s.is_active?'Disable':'Enable'}</button>
        <button class="danger small" onclick="deleteStep('${s.id}')">Delete</button>
      </div>
    </div>`).join("");
}

boot();
</script>
</body>
</html>
